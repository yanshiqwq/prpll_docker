services:
  prpll:
    build: ./PRPLL
    image: ghcr.io/yanshiqwq/prpll_docker/prpll:latest
    network_mode: none
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - gimps-data:/opt/prpll/data
      - /etc/localtime:/etc/localtime:ro
    command: ["-dir", "/opt/prpll/data/"]

  autoprimenet:
    build: ./AutoPrimeNet
    image: ghcr.io/yanshiqwq/prpll_docker/autoprimenet:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - gimps-data:/opt/autoprimenet/data
    command: ["--prpll", "-w", "/opt/autoprimenet/data/", "-l", "prime.ini", "--watch", "--cert-work"]

  monitor:
    build: ./monitor
    image: ghcr.io/yanshiqwq/prpll_docker/monitor:latest
    restart: unless-stopped
    user: root
    ports:
      - "8086:8080"
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/data
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
      - PRPLL_CONTAINER=${PRPLL_CONTAINER:-}
    volumes:
      - gimps-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gimps-data:
    external: true
