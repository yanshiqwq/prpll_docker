name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-images:
    name: Build Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: prpll
            context: ./PRPLL
          - image: autoprimenet
            context: ./AutoPrimeNet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          # PR 来自 fork 时缓存只读，只在非 PR 时写入缓存
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
